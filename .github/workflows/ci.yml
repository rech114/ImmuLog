name: CI

on:
  push:
  workflow_dispatch:

jobs:
  # ① 逻辑冒烟：jsdom，快，跑在所有平台的共同部分
  smoke:
    name: 逻辑冒烟 (jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: tools
      - run: npm run smoke
        working-directory: tools
      - name: 上传逻辑冒烟日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: tools/smoke.log
          retention-days: 14

  # ② 视觉/布局冒烟：真实 Chromium，跑在 x86_64 runner 上
  visual:
    name: 视觉布局冒烟 (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: tools
      - run: npx playwright install --with-deps chromium
        working-directory: tools
      - name: 跑视觉检查
        run: node visual.mjs 2>&1 | tee visual.log
        working-directory: tools
      - name: 上传截图与实测数据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            artifacts/
            tools/visual.log
          retention-days: 14
