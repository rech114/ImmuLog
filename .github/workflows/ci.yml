name: CI

on:
  push:
  workflow_dispatch:

jobs:
  # 1) Go: static checks plus the full unit/integration suite (with race detection)
  go:
    name: Go checks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the DCO check needs full history
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: Dependencies must be zero third-party
        run: |
          if [ -s go.sum ]; then
            echo "::error::go.sum is not empty: a third-party dependency was introduced:"
            cat go.sum
            exit 1
          fi
          echo "go.sum does not exist (or is empty) -- zero third-party dependencies"
          go mod verify
      - run: go build ./...
      - run: go vet ./...
      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: The frontend must make no external requests (supply chain)
        run: |
          # A tamper-evidence product must not fetch its assets from a third party
          # at runtime. XML namespace URIs are not requests, so they are allowed.
          hits=$(grep -rnoE 'https?://[^"'"'"')[:space:]]*' web/ \
                 --include='*.html' --include='*.css' --include='*.js' \
                 | grep -vE 'w3\.org|schema\.org' || true)
          if [ -n "$hits" ]; then
            echo "::error::web/ still references an external URL:"
            echo "$hits"
            echo "Run tools/vendor.sh and point at web/vendor/ instead."
            exit 1
          fi
          echo "web/ makes no external requests"
      - name: Every source file must carry an SPDX header
        run: |
          missing=""
          for f in $(find . -name '*.go' -o -name '*.js' -o -name '*.mjs' | grep -v '/\.git/' | grep -v node_modules | grep -v '/web/vendor/' | sort); do
            head -1 "$f" | grep -q 'SPDX-License-Identifier: Apache-2.0' || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "::error::these files are missing SPDX-License-Identifier: Apache-2.0"
            for f in $missing; do echo "  $f"; done
            exit 1
          fi
          echo "all source files carry a licence header"
      - name: Every commit must carry a DCO Signed-off-by
        run: |
          missing=""
          for sha in $(git rev-list HEAD); do
            git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: ' || missing="$missing $sha"
          done
          if [ -n "$missing" ]; then
            echo "::error::these commits are missing a Signed-off-by (DCO 1.1):"
            for sha in $missing; do echo "  $sha $(git log -1 --format=%s $sha)"; done
            echo "fix with: git commit -s, or git rebase --signoff"
            exit 1
          fi
          echo "every commit is DCO-signed"
      # -race needs a real kernel: the local aarch64 proot sandbox has VMA limits
      - name: Full test suite (with race detection)
        run: go test -race -count=1 -v ./... 2>&1 | tee go-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-test-log
          path: go-test.log
          retention-days: 14

  # 2) Frontend logic: jsdom drives the DOM black-box, plus stylesheet integrity
  smoke:
    name: Logic smoke (jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: tools
      - name: Run the logic smoke test
        shell: bash
        run: node smoke.mjs 2>&1 | tee smoke.log
        working-directory: tools
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-log
          path: tools/smoke.log
          retention-days: 14

  # 3) Real browser: layout / shapes / resilience / SSE / a11y / end-to-end
  browser:
    name: Browser and end-to-end (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - run: npm install --no-audit --no-fund
        working-directory: tools
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: tools
      - name: Run every browser check (including end-to-end against the real Go backend)
        shell: bash
        run: node run.mjs 2>&1 | tee visual.log
        working-directory: tools
      - name: Upload screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: |
            artifacts/
            tools/visual.log
          retention-days: 14
