name: CI

on:
  push:
  workflow_dispatch:

jobs:
  # ① 逻辑冒烟：jsdom，秒级，跑在前端逻辑层
  smoke:
    name: 逻辑冒烟 (jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装依赖
        run: npm install --no-audit --no-fund
        working-directory: tools
      - name: 跑逻辑冒烟
        run: npm run smoke
        working-directory: tools
      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          path: tools/smoke.log
          retention-days: 14

  # ② 浏览器检查：真实 Chromium（x86_64 runner，规避本机 aarch64 的指令集风险）
  browser:
    name: 浏览器检查 (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装依赖
        run: npm install --no-audit --no-fund
        working-directory: tools
      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium
        working-directory: tools
      - name: 跑布局 / 形状 / 韧性 / SSE / 无障碍
        run: npm run visual
        working-directory: tools
      - name: 上传截图与实测数据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: |
            artifacts/
            tools/visual.log
          retention-days: 14
